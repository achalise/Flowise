apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowise-deployment
  labels:
      app: flowise-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowise-app
  template:
    metadata:
      labels:
        app: flowise-app
    spec:
      containers:
      - name: flowise-container
        image: flowise:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: DATABASE_TYPE
          value: 'postgres'
        - name: DATABASE_HOST
          value: 'postgres-service'
        - name: DATABASE_PORT
          value: '5432'  
        - name: DATABASE_NAME
          value: 'flowise'
        - name: DATABASE_USER
          value: 'postgres' 
        - name: DATABASE_PASSWORD 
          valueFrom:
            secretKeyRef: 
              name: db-secrets
              key: db_password
        - name: DATABASE_SSL
          value: 'false'  
        # - name: DATABASE_SSL_KEY_BASE64
        #   value: ''
---
apiVersion: v1
kind: Service
metadata:
  name: flowise-service
  labels:
    app: flowise-app
spec:
  type: NodePort
  selector:
    app: flowise-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30001

# kubectl port-forward svc/flowise-service 8080:80
      
